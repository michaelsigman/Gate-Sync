# Gate Sync — Render deployment (manual-use web service)
# Hosts the operator UI: pull up arrivals for a date, review parsed driver
# names, and add them to the gate(s) via the Dry-run/Live toggle.
# Sweeps run in-process every 15 min (src/automation.js); no separate cron job.

services:
  - type: web
    name: bookedup-gate-sync
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Stage 1 (preview): no gate writes anywhere. Writes need DRY_RUN exactly "false" AND
      # AUTO_ADD "true" AND a property with mode "live" in gate_property_map.json.
      - key: DRY_RUN
        value: "true"
      - key: AUTO_ADD
        value: "true"          # sweeps run and log WOULD ADD; still no writes while DRY_RUN is true
      - key: SWEEP_CRON
        value: "*/15 * * * *"
      - key: AP_FEED_URL
        value: https://us-west1-arrival-pilot-dev.cloudfunctions.net/gateSyncFeed
      - key: GATE_SYNC_TOKEN
        sync: false            # = Secret Manager GATE_SYNC_TOKEN (arrival-pilot-dev)
      - key: UI_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false            # failure email; unset = alerts skipped quietly
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: PROPTIA_USERNAME
        sync: false
      - key: PROPTIA_PASSWORD
        sync: false
      - key: PROPTIA_LOGIN_PATH
        value: /en-us/proptia/accounts/login/
      - key: GOACCESS_USERNAME
        sync: false
      - key: GOACCESS_PASSWORD
        sync: false
      - key: GOACCESS_ANON_KEY
        sync: false
      - key: GOACCESS_RESIDENT_ID
        sync: false
      - key: GOACCESS_VISITOR_TYPE_ID
        value: cd2ad43d-2abd-46fe-aee7-6a23069ac2ff
      - key: PROPERTY_UTC_OFFSET_HOURS
        value: "7"
      - key: GOACCESS_MAX_SEGMENT_DAYS
        value: "6"
      - key: HOSTFULLY_API_KEY
        sync: false
      - key: HOSTFULLY_AGENCY_UID
        sync: false
